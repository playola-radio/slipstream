name: Tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    # Slipstream's capture path is FSEvents (@parcel/watcher) and it runs on the
    # developer's Mac via Conductor, so CI validates on macOS. inotify has
    # different watch semantics that Stage 1 does not yet target.
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
