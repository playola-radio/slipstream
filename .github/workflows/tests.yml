name: Tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    # The deterministic tier (`npm test`) drives capture through FakePlatform, so
    # it does not depend on FSEvents timing or permission enforcement and runs
    # honestly on both platforms. Running both proves portability. The real-OS
    # tier (`npm run test:os`) needs real FSEvents and runs on a developer Mac.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test
