name: Tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    permissions:
      contents: read
    # The deterministic tier (`npm test`) drives capture through FakePlatform, so
    # it does not depend on FSEvents timing or permission enforcement and runs
    # honestly on both platforms. Running both proves portability. The real-OS
    # tier (`npm run test:os`) needs real FSEvents and runs on a developer Mac.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history so the display-fold immutability gate can resolve the
          # PR's base commit and diff released contract files against it.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Run tool tests
        run: npm run test:tools

      - name: Check the published package
        # Packs the repo, installs the tarball into a fresh project, and runs the
        # installed CLI, schema loading, and workers from node_modules (where
        # Node refuses to strip types). Needs the npm registry for dependencies.
        run: npm run check:package

      - name: Run QA acceptance checks (macOS only)
        # qa:check drives REAL daemons; several acceptance modules are darwin-gated
        # (they need real FSEvents capture) and projection-check REFUSES them with a
        # non-zero exit on linux rather than counting a skip as a pass — so this gate
        # runs on macOS only, where every registered module executes for real (~30s).
        if: runner.os == 'macOS'
        run: npm run qa:check -- --all

      - name: Check display-fold release immutability (pull request)
        if: github.event_name == 'pull_request'
        run: npm run check:fold-release -- --base ${{ github.event.pull_request.base.sha }}

      - name: Check display-fold release immutability (push)
        if: github.event_name == 'push'
        # `before` is the pre-push tip of this branch — the right baseline for what
        # THIS push changed. It's all-zeros for a brand-new branch/force-created ref,
        # which the checker already fails closed on (unresolved base = non-zero exit),
        # so this never silently skips the gate.
        run: npm run check:fold-release -- --base ${{ github.event.before }}
