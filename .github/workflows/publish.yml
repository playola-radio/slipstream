name: Publish

# Publishes a new npm version for every merge to develop that passes Tests.
#
# A merge whose version is already on npm gets the next patch version: the bump
# job commits it to develop as `chore: release v<version>` and starts this
# workflow on that commit, which runs Tests itself and then publishes. A run
# that GITHUB_TOKEN starts never fires `workflow_run`, so the dispatched run
# can't wait for a separate Tests run. Publishing in a later run keeps npm
# provenance pointing at the commit that holds the version. A merge that
# changes the version itself (e.g. a minor bump) publishes as is. A commit that
# changes the version is never bumped again, so a re-run of a published release
# does nothing.
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      release_sha:
        description: The release commit the bump job pushed. Leave empty when running by hand.
        required: false
        type: string

# Each job grants only the token scopes it needs.
permissions: {}

concurrency:
  group: publish-npm
  cancel-in-progress: false
  # Without a queue, a newer pending run cancels an older one, even when the
  # newer one is a stale run that will do nothing.
  queue: max

jobs:
  tests:
    # A dispatched run tests the exact commit it may publish.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  publish:
    needs: tests
    # Checking the event also rules out a pull request from a fork whose branch
    # happens to be named develop.
    if: >-
      !cancelled() &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop' &&
        needs.tests.result == 'success') ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'develop'))
    permissions:
      contents: read
      actions: read
      # npm trusted publishing (OIDC) and provenance; there is no npm token.
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      TRIGGER: ${{ github.event_name == 'workflow_dispatch' && 'dispatch' || 'push' }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.check.outputs.version }}
      published: ${{ steps.publish.outcome == 'success' }}
      bump: ${{ steps.check.outputs.bump }}

    steps:
      - name: Check out the tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.SHA }}
          # The parent tells whether this commit changed the version.
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          # No dependency cache: a publish should not restore files another
          # workflow could have written.

      - name: Decide whether to publish
        id: check
        run: |
          # npm provenance names GITHUB_SHA, which for workflow_run is develop's
          # tip when Tests finished. If develop has moved on, that newer
          # commit's own run publishes instead.
          if [ "$SHA" != "$GITHUB_SHA" ]; then
            echo "develop has moved on from $SHA to $GITHUB_SHA; leaving the publish to that commit's run."
            exit 0
          fi
          # The bump job names the commit it pushed. A newer merge on top of it
          # is released by its own push run; anything else means GitHub started
          # this run on a stale develop.
          if [ -n "$RELEASE_SHA" ] && [ "$RELEASE_SHA" != "$SHA" ]; then
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$RELEASE_SHA...$SHA" --jq .status)
            if [ "$status" = ahead ]; then
              echo "develop has moved on from the release commit $RELEASE_SHA to $SHA; leaving the publish to that commit's run."
              exit 0
            fi
            echo "::error::This run was started for the release commit $RELEASE_SHA but GitHub ran it on $SHA ($status). Run Publish by hand on develop."
            exit 1
          fi
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          previous=$(git show HEAD^:package.json | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # npm answers E404 for a version it doesn't have. Any other lookup
          # failure stops here rather than guessing which way to go.
          if npm view "$name@$version" version >/dev/null 2>"$RUNNER_TEMP/npm-view.log"; then
            published=true
          elif grep -q E404 "$RUNNER_TEMP/npm-view.log"; then
            published=false
          else
            cat "$RUNNER_TEMP/npm-view.log"
            echo "::error::Could not look up $name@$version on npm."
            exit 1
          fi
          if [ "$published" = false ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$TRIGGER" = push ] && [ "$version" = "$previous" ]; then
            # A merge can be published with the version it inherited from a
            # release commit; the release job tags it, and a re-run stops here.
            tagged=$(git ls-remote origin "refs/tags/v$version" "refs/tags/v$version^{}" | tail -n1 | cut -f1)
            if [ "$tagged" = "$SHA" ]; then
              echo "$name@$version was released from $SHA; nothing to do."
              exit 0
            fi
            echo "$name@$version is already published; bumping the patch version."
            echo "bump=true" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version is already published; nothing to do."
          fi

      - name: Make sure npm supports trusted publishing
        if: steps.check.outputs.publish == 'true'
        run: |
          required=11.5.1
          current=$(npm --version)
          if [ "$(printf '%s\n' "$required" "$current" | sort -V | head -n1)" != "$required" ]; then
            npm install -g npm@11
          fi
          npm --version

      - name: Install dependencies
        if: steps.check.outputs.publish == 'true'
        run: npm ci

      - name: Publish to npm
        id: publish
        if: steps.check.outputs.publish == 'true'
        # `prepack` builds dist.
        run: npm publish --provenance

  bump:
    needs: publish
    # `tests` is skipped on a push run, and a skipped job further up `needs`
    # skips this one unless the condition says otherwise.
    if: >-
      !cancelled() && needs.publish.result == 'success' &&
      needs.publish.outputs.bump == 'true'
    permissions:
      contents: write # push the release commit to develop
      actions: write # start Publish on it
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

    steps:
      - name: Check out the tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.SHA }}

      - name: Commit the next patch version to develop and publish it
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(npm version patch --no-git-tag-version)
          while true; do
            if npm view "$name@$version" version >/dev/null 2>"$RUNNER_TEMP/npm-view.log"; then
              version=$(npm version patch --no-git-tag-version)
            elif grep -q E404 "$RUNNER_TEMP/npm-view.log"; then
              break
            else
              cat "$RUNNER_TEMP/npm-view.log"
              echo "::error::Could not look up $name@$version on npm."
              exit 1
            fi
          done
          git commit --quiet -m "chore: release $version" package.json package-lock.json
          release=$(git rev-parse HEAD)
          if ! git push origin HEAD:refs/heads/develop; then
            git fetch --quiet origin develop
            remote=$(git rev-parse FETCH_HEAD)
            # The bump is already there if a push landed though its reply was
            # lost, or an earlier attempt of this job pushed it before failing.
            if [ "$(git rev-parse "$remote^{tree}")" != "$(git rev-parse "HEAD^{tree}")" ]; then
              if [ "$remote" != "$SHA" ]; then
                echo "develop moved on to $remote while bumping to $version; leaving the release to that commit's run."
                exit 0
              fi
              echo "::error::Could not push the $version release commit to develop."
              exit 1
            fi
            release=$remote
          fi
          # A push made with GITHUB_TOKEN starts no workflows; a dispatch does.
          # Right after a push, GitHub can still resolve develop to its old tip,
          # so wait until it serves the release commit.
          for _ in $(seq 1 30); do
            tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/develop" --jq .sha)
            [ "$tip" = "$release" ] && break
            sleep 2
          done
          if [ "$tip" != "$release" ]; then
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$release...$tip" --jq .status)
            if [ "$status" = ahead ]; then
              echo "develop moved on from the release commit $release to $tip; leaving the release to that commit's run."
              exit 0
            fi
            echo "::error::GitHub still serves develop at $tip ($status), not the release commit $release. Re-run this job, or run Publish by hand on develop."
            exit 1
          fi
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref develop -f release_sha="$release"

  release:
    needs: publish
    # A separate job so "Re-run failed jobs" can retry the tag and release
    # without republishing. `!cancelled()` for the same reason as bump.
    if: >-
      !cancelled() && needs.publish.result == 'success' &&
      needs.publish.outputs.published == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      TAG: v${{ needs.publish.outputs.version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out the published commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.SHA }}

      - name: Tag the published commit
        run: |
          # The last line is the peeled commit for an annotated tag.
          existing=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -n1 | cut -f1)
          if [ "$existing" = "$SHA" ]; then
            echo "Tag $TAG already exists."
          elif [ -n "$existing" ]; then
            echo "::error::Tag $TAG points at $existing, not the published commit $SHA."
            exit 1
          else
            git tag "$TAG" "$SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Create the GitHub release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
