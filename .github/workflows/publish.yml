name: Publish

# Publishes a new npm version for every merge to develop that passes Tests.
#
# A merge whose version is already on npm gets the next patch version: the bump
# job commits it to develop as `chore: release v<version>` and runs Tests on
# that commit. That run's success brings this workflow back, and it publishes
# the release commit. Publishing in a later run keeps npm provenance pointing
# at the commit that holds the version. A merge that changes the version itself
# (e.g. a minor bump) publishes as is. A commit that changes the version is
# never bumped again, so a re-run of a published release does nothing.
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    # Checking the event also rules out a pull request from a fork whose branch
    # happens to be named develop. A `workflow_dispatch` Tests run is the bump
    # job's, or one started by hand.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop') ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_branch == 'develop')
    permissions:
      contents: read
      actions: read
      # npm trusted publishing (OIDC) and provenance; there is no npm token.
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      TESTS_EVENT: ${{ github.event.workflow_run.event }}
    outputs:
      version: ${{ steps.check.outputs.version }}
      published: ${{ steps.publish.outcome == 'success' }}
      bump: ${{ steps.check.outputs.bump }}

    steps:
      - name: Check out the tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.SHA }}
          # The parent tells whether this commit changed the version.
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          # No dependency cache: a publish should not restore files another
          # workflow could have written.

      - name: Confirm Tests passed on this commit (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow tests.yml \
            --branch develop --commit "$SHA" --json conclusion,event \
            --jq 'map(select(.conclusion == "success" and
              (.event == "push" or .event == "workflow_dispatch"))) | length')
          if [ "$passed" = "0" ]; then
            echo "::error::Tests have not passed on $SHA on develop; refusing to publish."
            exit 1
          fi

      - name: Decide whether to publish
        id: check
        run: |
          # npm provenance names GITHUB_SHA, which for workflow_run is develop's
          # tip when Tests finished. If develop has moved on, that newer
          # commit's own run publishes instead.
          if [ "$SHA" != "$GITHUB_SHA" ]; then
            echo "develop has moved on from $SHA to $GITHUB_SHA; leaving the publish to that commit's run."
            exit 0
          fi
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          previous=$(git show HEAD^:package.json | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A missing version exits non-zero (E404). Any other lookup failure
          # also falls through to publish, which npm refuses for a duplicate.
          if [ "$(npm view "$name@$version" version 2>/dev/null)" != "$version" ]; then
            # A dispatched run publishes only a release commit. A merge that lands
            # just as the bump job dispatches Tests is left to its push run, which
            # would otherwise find it published and bump it again.
            if [ "$TESTS_EVENT" = workflow_dispatch ] && [ "$version" = "$previous" ]; then
              echo "$SHA doesn't change the version; leaving the publish to its push run."
              exit 0
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$TESTS_EVENT" = push ] && [ "$version" = "$previous" ]; then
            echo "$name@$version is already published; bumping the patch version."
            echo "bump=true" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version is already published; nothing to do."
          fi

      - name: Make sure npm supports trusted publishing
        if: steps.check.outputs.publish == 'true'
        run: |
          required=11.5.1
          current=$(npm --version)
          if [ "$(printf '%s\n' "$required" "$current" | sort -V | head -n1)" != "$required" ]; then
            npm install -g npm@11
          fi
          npm --version

      - name: Install dependencies
        if: steps.check.outputs.publish == 'true'
        run: npm ci

      - name: Publish to npm
        id: publish
        if: steps.check.outputs.publish == 'true'
        # `prepack` builds dist.
        run: npm publish --provenance

  bump:
    needs: publish
    if: needs.publish.outputs.bump == 'true'
    permissions:
      contents: write # push the release commit to develop
      actions: write # run Tests on it
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

    steps:
      - name: Check out the tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.SHA }}

      - name: Commit the next patch version to develop and run Tests on it
        run: |
          version=$(npm version patch --no-git-tag-version)
          git commit --quiet -m "chore: release $version" package.json package-lock.json
          if ! git push origin HEAD:refs/heads/develop; then
            git fetch --quiet origin develop
            remote=$(git rev-parse FETCH_HEAD)
            # A push can land even though its reply was lost.
            if [ "$remote" != "$(git rev-parse HEAD)" ]; then
              if [ "$remote" != "$SHA" ]; then
                echo "develop moved on to $remote while bumping to $version; leaving the release to that commit's run."
                exit 0
              fi
              echo "::error::Could not push the $version release commit to develop."
              exit 1
            fi
          fi
          # A push made with GITHUB_TOKEN starts no workflows; a dispatch does.
          gh workflow run tests.yml --repo "$GITHUB_REPOSITORY" --ref develop

  release:
    needs: publish
    # A separate job so "Re-run failed jobs" can retry the tag and release
    # without republishing.
    if: needs.publish.outputs.published == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      TAG: v${{ needs.publish.outputs.version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out the published commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.SHA }}

      - name: Tag the published commit
        run: |
          # The last line is the peeled commit for an annotated tag.
          existing=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -n1 | cut -f1)
          if [ "$existing" = "$SHA" ]; then
            echo "Tag $TAG already exists."
          elif [ -n "$existing" ]; then
            echo "::error::Tag $TAG points at $existing, not the published commit $SHA."
            exit 1
          else
            git tag "$TAG" "$SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Create the GitHub release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
